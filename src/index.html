<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Title</title>
        <link rel="stylesheet" href="style/styles.css" />
        <link
            rel="stylesheet"
            href="./../node_modules/bootstrap/dist/css/bootstrap.min.css"
        />
    </head>
    <body>
        <main>
            <h1 class="text-center mt-5 mb-5">TODO LIST</h1>
            <div class="container">
                <div class="row">
                    <div class="col-4">
                        <form id="todoForm">
                            <div class="mb-3">
                                <label class="form-label" for="title"
                                    >Task title</label
                                >
                                <input
                                    type="text"
                                    id="title"
                                    class="form-control"
                                    placeholder="Title"
                                    required
                                />
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="description"
                                    >Task body</label
                                >
                                <textarea
                                    id="description"
                                    class="form-control"
                                    placeholder="Task body"
                                    cols="30"
                                    rows="10"
                                    required
                                ></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary">
                                Create Task!
                            </button>
                        </form>
                    </div>

                    <div class="col-8">
                        <div class="row" id="todoItems"></div>
                    </div>
                </div>
            </div>
        </main>
        <script src="js/script.js"></script>
    </body>
</html>
